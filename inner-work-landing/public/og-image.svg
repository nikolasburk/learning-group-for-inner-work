<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf9f6"/>
  <rect x="0" y="0" width="1200" height="10" fill="#6c71c4"/>
  <text x="80" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1e293b">A learning group</text>
  <text x="80" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1e293b">for inner work</text>
